info:
  name: Calculator
  type: http
  seq: 1

http:
  method: POST
  url: "{{PATH_URL}}/calculator"
  body:
    type: json
    data: |-
      {
        "n1": 4,
        "n2": 2,
        "operator": "÷"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
